spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/leconsulat
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 1996
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    com.leconsulat: DEBUG
    com.zaxxer.hikari: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
