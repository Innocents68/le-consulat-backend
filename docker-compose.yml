version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: leconsulat-db
    restart: unless-stopped
    # Tuning pour un VPS à 4 Go de RAM total (1 vCPU) : les valeurs par défaut de l'image
    # (shared_buffers=128MB mais surtout aucun plafond de connexions bas) laissent trop peu de
    # marge une fois le conteneur backend et son tas JVM pris en compte — voir mem_limit ci-dessous.
    command: postgres -c shared_buffers=192MB -c max_connections=40 -c work_mem=8MB -c maintenance_work_mem=32MB
    mem_limit: 700m
    environment:
      POSTGRES_DB: ${DB_NAME:-leconsulat}
      POSTGRES_USER: ${DB_USER:-leconsulat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leconsulat}
    volumes:
      - leconsulat-db-data:/var/lib/postgresql/data
    ports:
      # Bound to localhost only — Postgres has no business being reachable from the public
      # internet. Use an SSH tunnel (`ssh -L 5432:localhost:5432 user@server`) for a local
      # psql/GUI client if needed.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leconsulat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leconsulat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # -Xmx1536m : plafond du tas JVM, sur un VPS à 4 Go total (voir postgres.mem_limit +
    # OS/Nginx/Docker en dehors des conteneurs) — sans ce plafond la JVM peut réserver bien plus
    # que nécessaire et provoquer un OOM kill au pire moment (RAM totale, pas de swap infini).
    mem_limit: 1800m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx1536m -Xss512k"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-leconsulat}
      DB_USER: ${DB_USER:-leconsulat}
      DB_PASSWORD: ${DB_PASSWORD:-leconsulat}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      UPLOADS_DIR: /app/uploads
      BACKUPS_DIR: /app/backups
    volumes:
      - leconsulat-uploads:/app/uploads
      - leconsulat-backups:/app/backups
    ports:
      # Bound to localhost only — Nginx (or whatever reverse proxy sits in front) is the one
      # public-facing surface; it proxies to this port over loopback. Never expose 8080 directly
      # to the internet, that skips HTTPS entirely.
      - "127.0.0.1:8080:8080"

volumes:
  leconsulat-db-data:
  leconsulat-uploads:
  leconsulat-backups:
