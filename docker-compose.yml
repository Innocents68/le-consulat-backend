version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: leconsulat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-leconsulat}
      POSTGRES_USER: ${DB_USER:-leconsulat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leconsulat}
    volumes:
      - leconsulat-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leconsulat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leconsulat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-leconsulat}
      DB_USER: ${DB_USER:-leconsulat}
      DB_PASSWORD: ${DB_PASSWORD:-leconsulat}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      UPLOADS_DIR: /app/uploads
      BACKUPS_DIR: /app/backups
    volumes:
      - leconsulat-uploads:/app/uploads
      - leconsulat-backups:/app/backups
    ports:
      - "8080:8080"

volumes:
  leconsulat-db-data:
  leconsulat-uploads:
  leconsulat-backups:
