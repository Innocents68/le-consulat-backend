# Configuration Nginx pour Le Consulat : sert le frontend (fichiers statiques du build Vite)
# et fait office de reverse proxy vers le backend Spring Boot (Docker, écoute en local sur 8080).
#
# Remplacer VOTRE-DOMAINE.com ci-dessous, copier ce fichier vers
# /etc/nginx/sites-available/le-consulat sur le serveur, puis :
#   ln -s /etc/nginx/sites-available/le-consulat /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Lancer ensuite `certbot --nginx -d VOTRE-DOMAINE.com` : il réécrit ce fichier pour ajouter
# automatiquement le bloc HTTPS (443) et la redirection HTTP -> HTTPS.

server {
    listen 80;
    server_name VOTRE-DOMAINE.com www.VOTRE-DOMAINE.com;

    # Build de production du frontend (npm run build), copié sur le serveur.
    root /var/www/le-consulat-frontend/dist;
    index index.html;

    # Fichiers statiques hashés par Vite : cache long, ils changent de nom à chaque build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application React (SPA) : toute route inconnue retombe sur index.html, c'est
    # react-router-dom qui gère le routage côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST du backend.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket STOMP/SockJS (suivi cuisine, temps réel restaurant) — nécessite les en-têtes
    # Upgrade/Connection pour que la connexion ne reste pas bloquée en HTTP classique.
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location = /swagger-ui.html { proxy_pass http://127.0.0.1:8080; }
    location /v3/api-docs/ { proxy_pass http://127.0.0.1:8080; }

    # Fichiers uploadés (logo, justificatifs de dépenses) : servis par le backend, pas par Nginx.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Host $host;
    }
}
